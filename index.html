<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İPT v5.2 | Kesin Çözüm</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --p: #00ff41; --bg: #050505; --c: #0f0f0f; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--bg); color: #fff; font-family: 'Rajdhani', sans-serif; margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        
        #login-screen { position: fixed; inset: 0; background: radial-gradient(circle at center, #111 0%, #000 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .login-card { width: 92%; max-width: 400px; padding: 35px; background: var(--c); border: 1px solid var(--p); border-radius: 20px; text-align: center; box-shadow: 0 0 50px rgba(0, 255, 65, 0.1); border-top: 5px solid var(--p); }
        h1 { font-family: 'Orbitron'; font-weight: 900; color: var(--p); letter-spacing: 5px; margin-bottom: 25px; text-shadow: 0 0 10px var(--p); }
        input { width: 100%; padding: 14px; background: #000; border: 1px solid #222; color: #fff; border-radius: 10px; font-family: 'Rajdhani'; font-size: 1rem; margin-top: 10px; border: 1px solid #333; }
        .btn-main { width: 100%; padding: 16px; background: var(--p); color: #000; border: none; border-radius: 10px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; transition: 0.3s; margin-top: 20px; }

        #app { display: none; width: 100%; height: 100%; flex-direction: column; }
        nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1a1a1a; z-index: 500; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { color: #444; font-family: 'Orbitron'; font-size: 0.55rem; cursor: pointer; text-align: center; }
        .nav-item.active { color: var(--p); text-shadow: 0 0 10px var(--p); }
        .page { display: none; flex-direction: column; height: calc(100vh - 75px); padding: 15px; overflow-y: auto; }
        .page.active { display: flex; }

        /* CHAT */
        #chat-list { display: flex; flex-direction: column; gap: 12px; padding-bottom: 120px; }
        .m-wrap { max-width: 85%; align-self: flex-start; }
        .m-wrap.me { align-self: flex-end; }
        .m-box { background: #111; border: 1px solid #222; padding: 12px; border-radius: 12px; }
        .me .m-box { border-color: var(--p); background: rgba(0, 255, 65, 0.05); }
        .chat-input-fixed { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); width: 94%; max-width: 500px; display: flex; gap: 8px; background: #000; padding: 8px; border-radius: 12px; border: 1px solid #222; }

        /* GRID */
        .vid-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .video-card { background: #111; border: 1px solid #222; border-radius: 10px; overflow: hidden; }
        .video-card iframe { width: 100%; aspect-ratio: 16/9; border: none; pointer-events: auto; }
        .video-info { padding: 6px; font-size: 0.7rem; text-align: center; color: var(--p); }

        /* ADMIN */
        .stat-card { background: #0c0c0c; border: 1px solid #1a1a1a; padding: 12px; border-radius: 10px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #333; }
        .dot.online { background: var(--p); box-shadow: 0 0 10px var(--p); }

        .call-btn { width: 80px; height: 80px; border-radius: 50%; background: var(--p); border: none; font-size: 2rem; cursor: pointer; }
        .pulse { animation: p 2s infinite; }
        @keyframes p { 0% { box-shadow: 0 0 0 0px rgba(0, 255, 65, 0.4); } 100% { box-shadow: 0 0 0 20px rgba(0, 255, 65, 0); } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h1>İM-P-T</h1>
            <input type="text" id="u" placeholder="Kod Adı">
            <input type="email" id="m" placeholder="Gmail">
            <input type="password" id="p" placeholder="Şifre">
            <button class="btn-main" onclick="giris()">BAĞLAN</button>
        </div>
    </div>

    <div id="app">
        <div id="page-ann" class="page active">
            <h2 style="font-family:'Orbitron'; color:var(--p);">KAYITLAR</h2>
            <div id="ann-container"></div>
        </div>
        
        <div id="page-vid" class="page">
            <h2 style="font-family:'Orbitron'; color:var(--p);">VİDEOLAR</h2>
            <div class="vid-grid" id="vid-container"></div>
        </div>

        <div id="page-call" class="page">
            <h2 style="font-family:'Orbitron'; color:var(--p);">ARAMA</h2>
            <div style="text-align:center; margin-top:40px;">
                <button id="call-btn" class="call-btn" onclick="startCall()">📞</button>
                <h3 id="call-status" style="margin-top:20px; color:#444;">BEKLENİYOR</h3>
            </div>
        </div>

        <div id="page-chat" class="page">
            <div id="chat-list"></div>
            <div class="chat-input-fixed">
                <input type="text" id="msgI" placeholder="Mesaj...">
                <button onclick="sendMsg()" style="background:var(--p); border:none; padding:10px 15px; border-radius:10px; font-weight:900;">></button>
            </div>
        </div>

        <div id="page-admin" class="page">
            <h2 style="font-family:'Orbitron'; color:#ff3e3e;">ADMİN</h2>
            <div id="adm-auth"><input type="password" id="admK" placeholder="Key"><button class="btn-main" onclick="auth()">GİR</button></div>
            <div id="adm-panel" style="display:none;">
                <div id="status-list" style="margin-bottom:20px;"></div>
                <button class="btn-main" onclick="addAnn()">📢 DUYURU EKLE</button>
                <button class="btn-main" style="background:#00aaff; color:#fff;" onclick="addVid()">🎬 VİDEO EKLE</button>
                <button class="btn-main" style="background:#ff9900; color:#000;" onclick="addCall()">📞 ARAMA BAŞLAT</button>
                <button class="btn-main" style="background:#7a0000; color:#fff;" onclick="stopCall()">🚫 ARAMAYI KES</button>
                <button class="btn-main" style="background:#ff3e3e; color:#fff;" onclick="delChat()">🗑️ SIFIRLA</button>
            </div>
        </div>

        <nav>
            <div class="nav-item active" onclick="tab('ann', this)">📢</div>
            <div class="nav-item" onclick="tab('vid', this)">🎬</div>
            <div class="nav-item" onclick="tab('call', this)">📞</div>
            <div class="nav-item" onclick="tab('chat', this)">💬</div>
            <div class="nav-item" onclick="tab('admin', this)">🛡️</div>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, set, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/9.1.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtzTIQm1vvsYZRHV6t9RsTBK3Uma6K8rA",
            authDomain: "imanpowerchat.firebaseapp.com",
            databaseURL: "https://imanpowerchat-default-rtdb.firebaseio.com",
            projectId: "imanpowerchat",
            storageBucket: "imanpowerchat.firebasestorage.app",
            appId: "1:809946654937:web:f34de2239ecdeb648036c8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const teşkilat = {
            "osimhendizkapağı": { m: "mdegirmenci244@gmail.com", p: ".321mustafa" },
            "kuranokuyandefans": { m: "reozt2000@gmail.com", p: ".123reşit321." },
            "yetimhanekundakçısı": { m: "g17058525@gmail.com", p: "ismailçipe" },
            "müslimmendez": { m: "mustafaslan.gamer1907@gmail.com", p: "mus10ta20fa30" },
            "duvaradam": { m: "beratcihadyeten@gmail.com", p: "geçityokberobaba41" }
        };

        let me = "";
        window.roomUrl = null;

        // GLOBAL YAPILAN FONKSİYONLAR
        window.giris = () => {
            const u = document.getElementById('u').value.trim().toLowerCase();
            const m = document.getElementById('m').value.trim().toLowerCase();
            const p = document.getElementById('p').value.trim();
            if(teşkilat[u] && teşkilat[u].m === m && teşkilat[u].p === p) {
                me = u; document.getElementById('login-screen').style.display='none'; document.getElementById('app').style.display='flex';
                const sR = ref(db, 'online/' + u); set(sR, true); onDisconnect(sR).remove();
                startSync();
            } else { alert("Hatalı!"); }
        };

        window.auth = () => { if(document.getElementById('admK').value === "imanpoweradmini31") { document.getElementById('adm-auth').style.display='none'; document.getElementById('adm-panel').style.display='block'; } };

        window.sendMsg = () => {
            const v = document.getElementById('msgI').value;
            if(v) { push(ref(db, 'messages'), { u: me, t: v }); document.getElementById('msgI').value = ''; }
        };

        window.addAnn = () => { const t = prompt("Duyuru:"); if(t) push(ref(db, 'ann'), { t: t, d: new Date().toLocaleString('tr-TR') }); };
        
        window.addVid = () => { 
            const t = prompt("Başlık:"); 
            const url = prompt("Link:"); 
            if(t && url) push(ref(db, 'videos'), { t: t, url: url }); 
        };

        window.addCall = () => { const url = prompt("Link:"); if(url) set(ref(db, 'callRoom'), { active: true, url: url }); };
        window.stopCall = () => { set(ref(db, 'callRoom'), { active: false, url: "" }); };
        window.delChat = () => { if(confirm("Sil?")) remove(ref(db, 'messages')); };
        window.startCall = () => { if(window.roomUrl) window.open(window.roomUrl, '_blank'); };
        
        window.tab = (id, el) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active'); el.classList.add('active');
        };

        function startSync() {
            onValue(ref(db, 'messages'), s => {
                const l = document.getElementById('chat-list'); l.innerHTML = '';
                s.forEach(i => { const d = i.val(); l.innerHTML += `<div class="m-wrap ${d.u===me?'me':''}"><div class="m-box"><small style="color:var(--p)">${d.u}</small><br>${d.t}</div></div>`; });
                document.getElementById('page-chat').scrollTop = 99999;
            });

            onValue(ref(db, 'ann'), s => {
                const c = document.getElementById('ann-container'); c.innerHTML = '';
                let items = []; s.forEach(i => items.unshift(i.val()));
                items.forEach(d => c.innerHTML += `<div style="background:#111;padding:12px;border-radius:10px;margin-bottom:8px;border-left:4px solid var(--p)">${d.t}</div>`);
            });

            onValue(ref(db, 'videos'), s => {
                const v = document.getElementById('vid-container'); v.innerHTML = '';
                let items = []; s.forEach(i => items.unshift(i.val()));
                items.forEach(d => {
                    const id = d.url.includes('v=') ? d.url.split('v=')[1].split('&')[0] : d.url.split('/').pop();
                    v.innerHTML += `<div class="video-card"><iframe src="https://www.youtube.com/embed/${id}"></iframe><div class="video-info">${d.t}</div></div>`;
                });
            });

            onValue(ref(db, 'callRoom'), s => {
                const st = document.getElementById('call-status'); const btn = document.getElementById('call-btn');
                if(s.val() && s.val().active) { st.innerHTML = "OPERASYON AKTİF"; st.style.color="red"; btn.classList.add('pulse'); window.roomUrl = s.val().url; }
                else { st.innerHTML = "BEKLENİYOR"; st.style.color="#444"; btn.classList.remove('pulse'); window.roomUrl = null; }
            });

            onValue(ref(db, 'online'), s => {
                const l = document.getElementById('status-list'); if(!l) return; l.innerHTML = '';
                const onlines = s.val() || {};
                Object.keys(teşkilat).forEach(u => {
                    const isO = onlines[u] === true;
                    l.innerHTML += `<div class="stat-card"><span>${u}</span><span class="dot ${isO?'online':''}"></span></div>`;
                });
            });
        }
    </script>
</body>
</html>
